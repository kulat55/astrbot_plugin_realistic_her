name: astrbot_plugin_realistic_her
display_name: 真人化增强
short_desc: 失联反应/反向查岗/天气/爱好/主动发图/熬夜提醒/重要日子/情绪关心/翻旧账/吃醋/猜作息/表情包 + 约定/猜拳/真心话
desc: 为虚拟人格补全真人感：后台主动调度（失联反应、反向查岗、天气感知、爱好进展、主动发图、熬夜提醒、重要日子、情绪关心），对话追加（翻旧账、吃醋、猜作息、表情包），以及命令（/记住 /约定 /猜拳 /真心话）。依赖本地生图服务（E:\sdgen）与 deepseek（读取 AstrBot 配置）。
help: |-
  /记住 <日期> <事情> —— 存重要日子，到点主动提
  /约定 <时间> <事情> —— 存承诺，到点提醒
  /猜拳 —— 石头剪刀布
  /真心话 [问题] —— 她出题或答题
version: v1.0.0
author: kulat55
support_platforms:
  - aiocqhttp
